on:
  push:
    branches: [main]
  workflow_dispatch:

name: publish

# Renders the Quarto site and publishes it to GitHub Pages via the
# GitHub-Actions-native Pages flow (upload-pages-artifact + deploy-pages),
# same pattern as kapelner/EDI's pkgdown.yaml. Repo Pages source must be set
# to "GitHub Actions" (Settings -> Pages) for this to deploy anywhere.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
